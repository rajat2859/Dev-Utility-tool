<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient (Light / Default) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Top Highlight Gradient for Depth -->
    <linearGradient id="topGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Sparkle Accent Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Soft Drop Shadow for Icon -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Bevel -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Top Glass Highlight Rim -->
  <path d="M 2 18 C 2 9 9 2 18 2 L 46 2 C 55 2 62 9 62 18 L 62 26 C 45 31 19 31 2 26 Z" fill="url(#topGlow)" />

  <!-- Inner Stroke (Polished App Icon Border) -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

  <!-- Central Utility Wrench Mark -->
  <g filter="url(#dropShadow)" transform="translate(8.5, 8.5) scale(1.95)">
    <path
      d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- AI / Developer Sparkle Star Accent in Top-Right -->
  <g filter="url(#dropShadow)">
    <path
      d="M 48 9 C 48 13.5 49.5 15 54 15 C 49.5 15 48 16.5 48 21 C 48 16.5 46.5 15 42 15 C 46.5 15 48 13.5 48 9 Z"
      fill="url(#sparkleGrad)"
    />
    <circle cx="53" cy="24" r="1.5" fill="#BAE6FD" />
  </g>
</svg>
