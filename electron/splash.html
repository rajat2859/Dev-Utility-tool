<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utility Tool Manager</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #FBEEE0;
        background-image: radial-gradient(rgba(20, 20, 20, 0.08) 1.2px, transparent 1.2px);
        background-size: 22px 22px;
        color: #141414;
        font-family: 'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        overflow: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none !important; }
        .sticker { animation: none !important; }
      }

      .brand-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
      }

      .brand-tile {
        width: 60px;
        height: 60px;
        background: #3B82F6;
        border: 2.5px solid #141414;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 3px 3px 0 #141414;
        color: #fff;
        z-index: 2;
      }

      .brand-tile svg {
        width: 28px;
        height: 28px;
      }

      .spinner {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 2.5px solid transparent;
        border-top-color: #141414;
        border-right-color: #F59E0B;
        animation: spin 1s linear infinite;
        z-index: 1;
      }

      .sticker {
        display: inline-block;
        padding: 6px 14px;
        transform: rotate(6deg);
        border: 2.5px solid #141414;
        border-radius: 10px;
        background: #FFD23F;
        color: #141414;
        box-shadow: 3px 3px 0 #141414;
        font: 700 10px 'Space Grotesk', sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-top: 8px;
      }

      .title {
        font: 700 22px 'Space Grotesk', sans-serif;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: #141414;
        margin: 0;
      }

      .subtitle {
        font: 600 12px 'Inter', system-ui, sans-serif;
        color: #4A4237;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .badge {
        background: #FFD23F;
        border: 2.5px solid #141414;
        box-shadow: 2px 2px 0 #141414;
        color: #141414;
        padding: 2px 8px;
        border-radius: 9999px;
        font: 700 10px 'Space Grotesk', sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="brand-wrap">
      <div class="spinner"></div>
      <div class="brand-tile">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
    </div>
    <h1 class="title">Utility Tool Manager</h1>
    <p class="subtitle">
      <span>Initializing Workspace</span>
      <span class="badge" id="version"></span>
    </p>
    <script>document.getElementById('version').textContent = 'v' + (new URLSearchParams(location.search).get('version') || '');</script>
  </body>
</html>
