<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utility Tool Manager</title>
    <!-- Mirrors the .app-initial-loader in ../index.html so splash → app reads as one screen. -->
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #FBEEE0;
        background-image: radial-gradient(rgba(20, 20, 20, .08) 1.2px, transparent 1.2px);
        background-size: 22px 22px;
        color: #141414;
        font-family: 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .loader-logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
      }
      .loader-icon-box {
        width: 60px;
        height: 60px;
        background: #3B82F6;
        border: 2.5px solid #141414;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 3px 3px 0 #141414;
        color: #fff;
      }
      .loader-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -.02em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .loader-subtitle {
        font-size: 12px;
        font-weight: 600;
        color: #4A4237;
      }
      .loader-bar-bg {
        width: 180px;
        height: 14px;
        background: #ffffff;
        border: 2.5px solid #141414;
        border-radius: 9999px;
        margin-top: 20px;
        overflow: hidden;
        box-shadow: 2px 2px 0 #141414;
      }
      .loader-bar-fill {
        height: 100%;
        width: 40%;
        border-radius: 9999px;
        background: #141414;
        animation: load-bar 1.1s cubic-bezier(.65, 0, .35, 1) infinite;
      }
      @keyframes load-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-bar-fill { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div class="loader-logo-wrap">
      <div class="loader-icon-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
    </div>
    <div class="loader-title">Utility Tool Manager</div>
    <div class="loader-subtitle">Initializing Workspace</div>
    <div class="loader-bar-bg">
      <div class="loader-bar-fill"></div>
    </div>
  </body>
</html>
